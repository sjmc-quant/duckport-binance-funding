[project]
name = "binance-funding"
version = "0.1.0"
description = "Standalone Binance USD-M funding-rate ingestor for duckport-rs"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "aiohttp>=3.9",
    "websockets>=13.0",
    "python-dotenv>=1.0",
    "colorama>=0.4",
    "pytz",
    "duckdb==1.5.1",
    "lxml>=5.0",
    "aiofiles>=24.0",
    "tqdm>=4.60",
    "python-dateutil>=2.8",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["binance_funding*"]

[project.scripts]
binance-funding = "binance_funding.main:main"
loadhist = "binance_funding.loadhist:main"
